<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KarirKU — Konsultan Karier & CV</title>
<style>
  :root {
    --sidebar-w: 282px;
    --accent: #5b5bd6;
    --accent-2: #8b5cf6;
    --radius: 22px;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }

  [data-theme="light"] {
    --bg: #eef1f8;
    --glass: rgba(255, 255, 255, .55);
    --glass-strong: rgba(255, 255, 255, .78);
    --glass-hover: rgba(255, 255, 255, .7);
    --stroke: rgba(255, 255, 255, .75);
    --stroke-soft: rgba(15, 23, 42, .08);
    --text: #16181d;
    --muted: #646b7c;
    --shadow: 0 8px 32px rgba(31, 38, 70, .10);
    --shadow-sm: 0 2px 10px rgba(31, 38, 70, .06);
    --danger: #dc2626;
    --user-tint: rgba(91, 91, 214, .09);
  }

  [data-theme="dark"] {
    --bg: #080a10;
    --glass: rgba(255, 255, 255, .07);
    --glass-strong: rgba(255, 255, 255, .12);
    --glass-hover: rgba(255, 255, 255, .11);
    --stroke: rgba(255, 255, 255, .13);
    --stroke-soft: rgba(255, 255, 255, .08);
    --text: #eef1f7;
    --muted: #99a1b3;
    --shadow: 0 10px 40px rgba(0, 0, 0, .45);
    --shadow-sm: 0 2px 12px rgba(0, 0, 0, .3);
    --danger: #f87171;
    --user-tint: rgba(139, 92, 246, .16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button, textarea, input { font-family: inherit; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--stroke-soft); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); opacity: .5; }

  /* ---------- Aurora background ---------- */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; }
  .b1 { width: 46vw; height: 46vw; background: #7c6cf6; top: -14%; left: -8%; animation: drift 26s var(--ease) infinite alternate; }
  .b2 { width: 40vw; height: 40vw; background: #38bdf8; bottom: -16%; right: -6%; animation: drift 31s var(--ease) infinite alternate-reverse; }
  .b3 { width: 34vw; height: 34vw; background: #f472b6; top: 34%; right: 22%; opacity: .42; animation: drift 37s var(--ease) infinite alternate; }
  .b4 { width: 28vw; height: 28vw; background: #34d399; bottom: 12%; left: 16%; opacity: .34; animation: drift 29s var(--ease) infinite alternate-reverse; }

  [data-theme="dark"] .blob { opacity: .3; }
  [data-theme="dark"] .b3 { opacity: .24; }
  [data-theme="dark"] .b4 { opacity: .18; }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(6vw, 5vh) scale(1.18); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }

  /* ---------- Glass primitive ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow-sm);
  }

  /* ---------- Layout ---------- */
  .app { display: flex; height: 100dvh; }

  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    background: var(--glass);
    border-right: 1px solid var(--stroke);
    display: flex; flex-direction: column;
    z-index: 20;
  }

  .side-top { padding: 16px 14px 10px; }

  .brand { display: flex; align-items: center; gap: 11px; padding: 4px 6px 16px; }

  .logo {
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff;
    box-shadow: 0 4px 14px rgba(91, 91, 214, .35); flex-shrink: 0;
  }

  .brand h1 { font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; }
  .brand p { font-size: 11.5px; color: var(--muted); }

  .btn-new {
    width: 100%; border: 1px solid var(--stroke); border-radius: 14px;
    background: var(--glass-strong); color: var(--text);
    padding: 11px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: transform .18s var(--ease), background .18s;
  }
  .btn-new:hover { background: var(--glass-hover); transform: translateY(-1px); }

  .conv-list { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }

  .conv {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 11px; border-radius: 12px; cursor: pointer;
    color: var(--muted); font-size: 13.5px; margin-bottom: 2px;
    transition: background .16s, color .16s;
  }
  .conv:hover { background: var(--glass-hover); color: var(--text); }
  .conv.active { background: var(--glass-strong); color: var(--text); box-shadow: var(--shadow-sm); }
  .conv .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .del {
    opacity: 0; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 15px; line-height: 1; padding: 3px 5px; border-radius: 6px;
    transition: opacity .16s, color .16s;
  }
  .conv:hover .del { opacity: 1; }
  .conv .del:hover { color: var(--danger); background: var(--glass-strong); }

  .side-foot { padding: 11px 18px; border-top: 1px solid var(--stroke-soft); font-size: 11px; color: var(--muted); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; z-index: 10;
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    background: var(--glass); border-bottom: 1px solid var(--stroke);
  }

  .topbar .sub { font-size: 13.5px; font-weight: 550; color: var(--text); }

  .icon-btn {
    background: var(--glass-strong); border: 1px solid var(--stroke); color: var(--text);
    border-radius: 11px; padding: 7px 11px; cursor: pointer; font-size: 14px;
    transition: background .16s, transform .16s var(--ease);
  }
  .icon-btn:hover { background: var(--glass-hover); transform: translateY(-1px); }
  .icon-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .btn-menu { display: none; }
  .spacer { flex: 1; }

  /* ---------- Chat ---------- */
  #chat {
    flex: 1; overflow-y: auto; padding: 28px 20px 12px;
    scroll-behavior: smooth;
  }

  .thread { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .row { display: flex; gap: 14px; align-items: flex-start; animation: rise .32s var(--ease); }
  .row.user { flex-direction: row-reverse; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .avatar {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; margin-top: 2px;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 3px 10px rgba(91, 91, 214, .3);
  }
  .row.user .avatar { background: var(--glass-strong); color: var(--muted); border: 1px solid var(--stroke); box-shadow: none; }

  .bubble {
    min-width: 0; max-width: calc(100% - 44px);
    font-size: 15px; line-height: 1.72; letter-spacing: -.003em;
  }
  .row.user .bubble {
    background: var(--user-tint); border: 1px solid var(--stroke-soft);
    padding: 11px 16px; border-radius: 20px;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }

  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
  .bubble li { margin-bottom: 4px; }
  .bubble h3 { font-size: 15.5px; margin: 14px 0 7px; letter-spacing: -.01em; }
  .bubble h3:first-child { margin-top: 0; }
  .bubble hr { border: none; border-top: 1px solid var(--stroke-soft); margin: 14px 0; }
  .bubble pre {
    background: var(--glass-strong); border: 1px solid var(--stroke-soft); border-radius: 12px;
    padding: 12px 14px; overflow-x: auto; font-size: 13px; margin: 8px 0; line-height: 1.55;
  }
  .bubble code { background: var(--glass-strong); padding: 1.5px 6px; border-radius: 6px; font-size: .88em; }
  .bubble pre code { background: none; padding: 0; }
  .bubble strong { font-weight: 650; }
  .bubble a { color: var(--accent); }

  .row.error .bubble {
    background: rgba(220, 38, 38, .09); border: 1px solid rgba(220, 38, 38, .28);
    padding: 12px 16px; border-radius: 18px;
  }

  .msg-files { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .row.user .msg-files { justify-content: flex-end; }

  .thumb { border-radius: 14px; overflow: hidden; border: 1px solid var(--stroke); box-shadow: var(--shadow-sm); }
  .thumb img { display: block; max-width: 190px; height: auto; cursor: zoom-in; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--glass-strong); border: 1px solid var(--stroke);
    border-radius: 11px; padding: 7px 12px; font-size: 12.5px; max-width: 240px;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .typing { display: flex; gap: 5px; padding: 10px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.3s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .16s; }
  .typing span:nth-child(3) { animation-delay: .32s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

  /* ---------- Composer ---------- */
  .composer { padding: 6px 20px 18px; z-index: 10; }

  .composer-inner { max-width: 768px; margin: 0 auto; }

  .attach-strip { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; }
  .attach-strip:empty { display: none; }

  .att {
    position: relative; border-radius: 13px; overflow: hidden;
    border: 1px solid var(--stroke); background: var(--glass-strong);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    animation: rise .25s var(--ease);
  }
  .att img { display: block; width: 66px; height: 66px; object-fit: cover; }
  .att .name { font-size: 10.5px; color: var(--muted); padding: 4px 8px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .x {
    position: absolute; top: 4px; right: 4px; background: rgba(0, 0, 0, .62); color: #fff;
    border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; line-height: 1;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }

  .input-shell {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 9px 9px 9px 10px; border-radius: 26px;
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow);
    transition: box-shadow .2s, border-color .2s;
  }
  .input-shell:focus-within { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 3px rgba(91, 91, 214, .14); }

  textarea {
    flex: 1; background: none; border: none; color: var(--text);
    font-size: 15px; line-height: 1.6; resize: none; outline: none;
    max-height: 168px; padding: 9px 4px; letter-spacing: -.003em;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:disabled { opacity: .55; }

  .round-btn {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--stroke); background: var(--glass); color: var(--muted);
    cursor: pointer; font-size: 16px;
    display: grid; place-items: center;
    transition: transform .18s var(--ease), background .18s, color .18s;
  }
  .round-btn:hover:not(:disabled) { background: var(--glass-hover); color: var(--text); transform: scale(1.06); }
  .round-btn:disabled { opacity: .4; cursor: not-allowed; }

  .round-btn.send {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent;
    box-shadow: 0 3px 12px rgba(91, 91, 214, .35);
  }
  .round-btn.send:hover:not(:disabled) { filter: brightness(1.08); }
  .round-btn.send:disabled { background: var(--stroke-soft); color: var(--muted); box-shadow: none; }

  .hint { font-size: 11.5px; color: var(--muted); margin-top: 10px; text-align: center; }

  /* ---------- Overlays ---------- */
  .dropzone {
    position: fixed; inset: 0; z-index: 50; display: none; place-items: center;
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    font-size: 17px; font-weight: 550; pointer-events: none;
  }
  .dropzone.on { display: grid; }

  .lightbox {
    position: fixed; inset: 0; z-index: 60; display: none; place-items: center;
    background: rgba(0, 0, 0, .8); padding: 24px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .lightbox.on { display: grid; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }

  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .32); z-index: 18; }
  .backdrop.on { display: block; }

  @media (max-width: 860px) {
    .sidebar {
      position: fixed; height: 100dvh;
      transform: translateX(-100%); transition: transform .28s var(--ease);
      box-shadow: 0 0 50px rgba(0, 0, 0, .2);
    }
    .sidebar.on { transform: none; }
    .btn-menu { display: grid; }
    #chat { padding: 20px 14px 8px; }
    .composer { padding: 4px 12px calc(14px + env(safe-area-inset-bottom)); }
    .row { gap: 10px; }
    .thumb img { max-width: 140px; }
  }
</style>
</head>

<div class="aurora" aria-hidden="true">

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">

<script>
/* ===================== Penyimpanan (IndexedDB) ===================== */
const DB_NAME = 'karirku';
const DB_VERSION = 1;
let dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('conversations')) {
        db.createObjectStore('conversations', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(mode, fn) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const t = db.transaction('conversations', mode);
    const store = t.objectStore('conversations');
    const out = fn(store);
    t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
    t.onerror = () => reject(t.error);
  }));
}

const store = {
  all: () => tx('readonly', (s) => s.getAll()),
  get: (id) => tx('readonly', (s) => s.get(id)),
  put: (conv) => tx('readwrite', (s) => { s.put(conv); return conv; }),
  del: (id) => tx('readwrite', (s) => { s.delete(id); }),
};

/* ===================== State ===================== */
const MAX_FILE_BYTES = 8 * 1024 * 1024;
const MAX_FILES = 4;
const ALLOWED = /^(image\/(png|jpeg|jpg|webp|gif|heic|heif)|application\/pdf|text\/(plain|csv|markdown))$/;
const THEME_KEY = 'karirku-theme';

const GREETING = 'Hai! Aku KarirKU 👋\n\nBantu kamu memilih arah karier sekaligus merapikan CV.\n\nCoba ceritakan:\n\n1. Kamu lulusan apa, dari mana?\n2. Sedang incar bidang apa, atau masih bingung?\n\nBoleh juga lampirkan foto CV atau berkas lain, nanti aku baca.';

let conversations = [];
let currentId = null;
let pending = [];
let busy = false;

const el = {
  chat: document.getElementById('chat'),
  thread: document.getElementById('thread'),
  input: document.getElementById('input'),
  sendBtn: document.getElementById('sendBtn'),
  attachBtn: document.getElementById('attachBtn'),
  fileInput: document.getElementById('fileInput'),
  strip: document.getElementById('strip'),
  convList: document.getElementById('convList'),
  convTitle: document.getElementById('convTitle'),
  newBtn: document.getElementById('newBtn'),
  clearBtn: document.getElementById('clearBtn'),
  themeBtn: document.getElementById('themeBtn'),
  sidebar: document.getElementById('sidebar'),
  backdrop: document.getElementById('backdrop'),
  menuBtn: document.getElementById('menuBtn'),
  dropzone: document.getElementById('dropzone'),
  lightbox: document.getElementById('lightbox'),
  lightboxImg: document.getElementById('lightboxImg'),
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const current = () => conversations.find((c) => c.id === currentId) || null;

/* ===================== Tema ===================== */
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  el.themeBtn.textContent = theme === 'dark' ? '☀' : '☾';
  el.themeBtn.title = theme === 'dark' ? 'Mode terang' : 'Mode gelap';
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (err) { saved = null; }
  if (!saved) {
    saved = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  applyTheme(saved);
})();

el.themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (err) { /* mode privat */ }
});

/* ===================== Render markdown ===================== */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}

function renderMarkdown(src) {
  const lines = String(src || '').split('\n');
  const out = [];
  let list = null;
  let code = null;

  const flushList = () => {
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
  };

  for (const raw of lines) {
    const line = raw.trimEnd();

    if (/^```/.test(line)) {
      if (code === null) { flushList(); code = []; } else { out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`); code = null; }
      continue;
    }
    if (code !== null) { code.push(raw); continue; }

    if (!line.trim()) { flushList(); continue; }

    if (/^(---+|\*\*\*+|___+)$/.test(line.trim())) { flushList(); out.push('<hr>'); continue; }

    const heading = line.match(/^\s{0,3}#{1,6}\s+(.*)$/);
    if (heading) { flushList(); out.push(`<h3>${inline(heading[1])}</h3>`); continue; }

    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    if (bullet) { (list ||= []).push(`<li>${inline(bullet[1])}</li>`); continue; }

    flushList();
    out.push(`<p>${inline(line)}</p>`);
  }

  if (code !== null) out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
  flushList();
  return out.join('');
}

/* ===================== Render pesan ===================== */
function filesMarkup(files) {
  if (!files || !files.length) return '';
  const items = files.map((f) =>
    f.mimeType.startsWith('image/')
      ? `<div class="thumb"><img src="${f.data}" alt="${escapeHtml(f.name)}" /></div>`
      : `<div class="chip">📄 <span>${escapeHtml(f.name)}</span></div>`
  ).join('');
  return `<div class="msg-files">${items}</div>`;
}

function scrollDown() {
  el.chat.scrollTop = el.chat.scrollHeight;
}

function addMessage(text, role, files) {
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'bot');

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '🙂' : 'K';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = filesMarkup(files) + renderMarkdown(text);

  bubble.querySelectorAll('.thumb img').forEach((img) => {
    img.addEventListener('click', () => {
      el.lightboxImg.src = img.src;
      el.lightbox.classList.add('on');
    });
  });

  row.append(avatar, bubble);
  el.thread.appendChild(row);
  scrollDown();
  return row;
}

function addError(text) {
  const row = document.createElement('div');
  row.className = 'row error';
  row.innerHTML = `<div class="avatar">!</div><div class="bubble">${renderMarkdown(text)}</div>`;
  el.thread.appendChild(row);
  scrollDown();
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = '<div class="avatar">K</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  el.thread.appendChild(row);
  scrollDown();
  return row;
}

function paintChat() {
  el.thread.innerHTML = '';
  const conv = current();
  if (!conv || conv.messages.length === 0) {
    addMessage(GREETING, 'bot');
  } else {
    conv.messages.forEach((m) => addMessage(m.content, m.role, m.files));
  }
  scrollDown();
}

function paintSidebar() {
  el.convList.innerHTML = '';
  const sorted = [...conversations].sort((a, b) => b.updatedAt - a.updatedAt);

  sorted.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'conv' + (c.id === currentId ? ' active' : '');

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = c.title || 'Chat baru';

    const del = document.createElement('button');
    del.className = 'del';
    del.title = 'Hapus';
    del.textContent = '✕';

    row.append(title, del);

    row.addEventListener('click', () => {
      currentId = c.id;
      closeSidebar();
      paintSidebar();
      paintChat();
      syncTitle();
      el.input.focus();
    });

    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      await store.del(c.id);
      conversations = conversations.filter((x) => x.id !== c.id);
      if (currentId === c.id) currentId = conversations[0]?.id || null;
      paintSidebar();
      paintChat();
      syncTitle();
    });

    el.convList.appendChild(row);
  });
}

function syncTitle() {
  el.convTitle.textContent = current()?.title || 'Chat baru';
}

/* ===================== Percakapan ===================== */
function newConversation() {
  const conv = { id: uid(), title: '', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
  conversations.unshift(conv);
  currentId = conv.id;
  pending = [];
  renderStrip();
  store.put(conv);
  paintSidebar();
  paintChat();
  syncTitle();
  closeSidebar();
  el.input.focus();
}

async function sendMessage() {
  const text = el.input.value.trim();
  if ((!text && !pending.length) || busy) return;

  const conv = current();
  if (!conv) return;

  const files = pending;
  conv.messages.push({ role: 'user', content: text, files, ts: Date.now() });
  if (!conv.title) conv.title = (text || files[0].name).slice(0, 42);
  conv.updatedAt = Date.now();

  addMessage(text, 'user', files);
  el.input.value = '';
  el.input.style.height = 'auto';
  pending = [];
  renderStrip();
  setBusy(true);
  paintSidebar();
  syncTitle();
  store.put(conv);

  const typing = showTyping();

  try {
    const payload = conv.messages.map((m) => ({ role: m.role, content: m.content, files: m.files || [] }));
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: payload })
    });
    const data = await res.json().catch(() => ({}));

    typing.remove();

    if (!res.ok) {
      conv.messages.pop();
      addError(data.error || 'Terjadi kesalahan. Coba lagi ya.');
      store.put(conv);
      return;
    }

    conv.messages.push({ role: 'model', content: data.reply, files: [], ts: Date.now() });
    conv.updatedAt = Date.now();
    addMessage(data.reply, 'bot');
    paintSidebar();
    store.put(conv);
  } catch (err) {
    typing.remove();
    conv.messages.pop();
    addError(
      window.location.protocol === 'file:'
        ? 'Halaman ini dibuka langsung dari file, jadi tidak bisa menghubungi server.\n\nJalankan `npm start` di folder KarirKU, lalu buka http://localhost:3000 (bukan dobel-klik file index.html).'
        : 'Gagal terhubung ke server. Pastikan server KarirKU masih jalan (npm start).'
    );
    store.put(conv);
  } finally {
    setBusy(false);
    el.input.focus();
  }
}

function setBusy(state) {
  busy = state;
  el.sendBtn.disabled = state;
  el.input.disabled = state;
  el.attachBtn.disabled = state;
}

/* ===================== Lampiran ===================== */
function renderStrip() {
  el.strip.innerHTML = '';
  pending.forEach((f, i) => {
    const box = document.createElement('div');
    box.className = 'att';
    box.innerHTML =
      (f.mimeType.startsWith('image/') ? `<img src="${f.data}" alt="" />` : '') +
      '<div class="name"></div><button class="x" aria-label="Hapus">✕</button>';
    box.querySelector('.name').textContent = f.name;
    box.querySelector('.x').addEventListener('click', () => {
      pending.splice(i, 1);
      renderStrip();
    });
    el.strip.appendChild(box);
  });
}

function addFiles(list) {
  for (const file of list) {
    if (pending.length >= MAX_FILES) {
      addError(`Maksimal ${MAX_FILES} lampiran per pesan.`);
      break;
    }
    if (!ALLOWED.test(file.type)) {
      addError(`Format "${file.name}" belum didukung. Pakai gambar (PNG/JPG/WebP), PDF, atau teks.`);
      continue;
    }
    if (file.size > MAX_FILE_BYTES) {
      addError(`"${file.name}" kebesaran (maks 8 MB).`);
      continue;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pending.push({ name: file.name, mimeType: file.type, data: reader.result });
      renderStrip();
    };
    reader.readAsDataURL(file);
  }
}

el.attachBtn.addEventListener('click', () => el.fileInput.click());
el.fileInput.addEventListener('change', (e) => {
  addFiles(e.target.files);
  e.target.value = '';
});

['dragenter', 'dragover'].forEach((ev) =>
  document.addEventListener(ev, (e) => {
    e.preventDefault();
    el.dropzone.classList.add('on');
  })
);

document.addEventListener('drop', (e) => {
  e.preventDefault();
  el.dropzone.classList.remove('on');
  if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});

document.addEventListener('dragleave', (e) => {
  if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
    el.dropzone.classList.remove('on');
  }
});

document.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) {
    e.preventDefault();
    addFiles(files);
  }
});

/* ===================== Sidebar mobile ===================== */
function openSidebar() {
  el.sidebar.classList.add('on');
  el.backdrop.classList.add('on');
}
function closeSidebar() {
  el.sidebar.classList.remove('on');
  el.backdrop.classList.remove('on');
}

el.menuBtn.addEventListener('click', openSidebar);
el.backdrop.addEventListener('click', closeSidebar);
el.lightbox.addEventListener('click', () => el.lightbox.classList.remove('on'));

/* ===================== Events ===================== */
el.sendBtn.addEventListener('click', sendMessage);

el.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

el.input.addEventListener('input', () => {
  el.input.style.height = 'auto';
  el.input.style.height = Math.min(el.input.scrollHeight, 168) + 'px';
});

el.newBtn.addEventListener('click', newConversation);

el.clearBtn.addEventListener('click', async () => {
  const conv = current();
  if (!conv) return;
  if (!confirm('Hapus seluruh isi chat ini dari komputer ini?')) return;
  conv.messages = [];
  conv.title = '';
  conv.updatedAt = Date.now();
  await store.put(conv);
  paintSidebar();
  paintChat();
  syncTitle();
});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    newConversation();
  }
});

/* ===================== Init ===================== */
(async function init() {
  try {
    conversations = (await store.all()) || [];
  } catch (err) {
    conversations = [];
  }

  conversations.sort((a, b) => b.updatedAt - a.updatedAt);

  if (conversations.length === 0) {
    const conv = { id: uid(), title: '', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
    conversations.push(conv);
    currentId = conv.id;
    store.put(conv);
  } else {
    currentId = conversations[0].id;
  }

  paintSidebar();
  paintChat();
  syncTitle();
  el.input.focus();
})();
</script>
</body>
</html>
