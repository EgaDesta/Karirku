<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KarirKU — Konsultan Karier & CV</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-user: #2563eb;
    --bubble-bot: #232833;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --border: #2a2f3a;
    --accent: #3b82f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 760px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: #1b1f27;
  }

  .logo {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
  }

  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12px; color: var(--muted); }

  .btn-reset {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-reset:hover { color: var(--text); border-color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg { max-width: 85%; padding: 11px 14px; border-radius: 14px; line-height: 1.6; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .msg.error { background: #4c1d24; border: 1px solid #7f2733; }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }

  @keyframes blink {
    0%, 60%, 100% { opacity: .3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: #1b1f27;
  }

  input {
    flex: 1;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  input:disabled { opacity: .5; }

  button[type="submit"] {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button[type="submit"]:hover { background: #2f6fd8; }
  button[type="submit"]:disabled { background: #334155; cursor: not-allowed; }

  @media (max-width: 560px) {
    body { padding: 0; }
    .app { border-radius: 0; border: none; height: 100dvh; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">K</div>
      <div>
        <h1>KarirKU</h1>
        <p>Konsultan karier &amp; CV untuk fresh graduate</p>
      </div>
      <button class="btn-reset" id="resetBtn" title="Mulai percakapan baru">Reset</button>
    </header>

    <div id="chat"></div>

    <form id="form">
      <input id="input" type="text" placeholder="Ceritakan sedikit tentang dirimu..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Kirim</button>
    </form>
  </div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');

  const GREETING =
    "Hai! Aku KarirKU 👋\n\nBantu kamu pilih arah karier sekaligus merapikan CV. Ceritakan dulu:\n\n1. Kamu lulusan apa & dari mana?\n2. Pengen kerja di bidang apa, atau masih bingung?";

  let history = [];
  let busy = false;

  function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addMessage(text, role) {
    const el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    el.textContent = text;
    chat.appendChild(el);
    scrollDown();
    return el;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.id = 'typing';
    el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(el);
    scrollDown();
    return el;
  }

  function setBusy(state) {
    busy = state;
    sendBtn.disabled = state;
    input.disabled = state;
  }

  function resetChat() {
    history = [];
    chat.innerHTML = '';
    addMessage(GREETING, 'bot');
    input.value = '';
    input.focus();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;

    addMessage(text, 'user');
    input.value = '';
    history.push({ role: 'user', content: text });

    setBusy(true);
    const typing = showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json().catch(() => ({}));
      typing.remove();

      if (!res.ok) {
        addMessage(data.error || 'Terjadi kesalahan. Coba lagi ya.', 'error');
        history.pop();
        return;
      }

      history.push({ role: 'model', content: data.reply });
      addMessage(data.reply, 'bot');
    } catch (err) {
      typing.remove();
      addMessage('Gagal terhubung ke server. Pastikan server KarirKU masih jalan.', 'error');
      history.pop();
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage();
  });

  resetBtn.addEventListener('click', resetChat);

  resetChat();
</script>
</body>
</html>
