<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KarirKU — Konsultan Karier & CV</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --head: #1b1f27;
    --bubble-user: #2563eb;
    --bubble-bot: #232833;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --border: #2a2f3a;
    --accent: #3b82f6;
    --danger: #f87171;
    --sidebar-w: 268px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  button { font-family: inherit; }

  .app { display: flex; height: 100dvh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--head);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .side-top { padding: 14px; border-bottom: 1px solid var(--border); }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    display: grid; place-items: center; font-weight: 700; font-size: 16px;
    flex-shrink: 0;
  }

  .brand h1 { font-size: 15px; font-weight: 600; }
  .brand p { font-size: 11px; color: var(--muted); }

  .btn-new {
    width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: 9px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-new:hover { background: #2f6fd8; }

  .conv-list { flex: 1; overflow-y: auto; padding: 8px; }

  .conv {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 10px; border-radius: 9px; cursor: pointer;
    color: var(--muted); font-size: 13px; margin-bottom: 2px;
  }
  .conv:hover { background: #232833; color: var(--text); }
  .conv.active { background: #232833; color: var(--text); }
  .conv .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .del {
    opacity: 0; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 5px;
  }
  .conv:hover .del { opacity: 1; }
  .conv .del:hover { color: var(--danger); background: #2d333f; }

  .side-foot { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--head);
  }

  .btn-menu {
    display: none; background: transparent; border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 15px;
  }

  .topbar .sub { font-size: 12px; color: var(--muted); }

  .btn-clear {
    margin-left: auto; background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 6px 11px;
    font-size: 12px; cursor: pointer;
  }
  .btn-clear:hover { color: var(--text); border-color: var(--accent); }

  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }

  .msg { max-width: 86%; padding: 11px 14px; border-radius: 14px; line-height: 1.6; font-size: 14.5px; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .msg.error { background: #4c1d24; border: 1px solid #7f2733; }

  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 0 0 8px; padding-left: 20px; }
  .msg ul:last-child { margin-bottom: 0; }
  .msg h3 { font-size: 14.5px; margin: 10px 0 6px; }
  .msg h3:first-child { margin-top: 0; }
  .msg hr { border: none; border-top: 1px solid #3a4150; margin: 10px 0; }
  .msg pre { background: #14171e; border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 13px; margin: 6px 0; }
  .msg code { background: #14171e; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .msg pre code { background: none; padding: 0; }

  .msg-files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .msg-files:last-child { margin-bottom: 0; }

  .thumb {
    border-radius: 9px; overflow: hidden; max-width: 150px; border: 1px solid rgba(255,255,255,.14);
  }
  .thumb img { display: block; width: 100%; height: auto; cursor: zoom-in; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.12); border-radius: 8px;
    padding: 6px 10px; font-size: 12.5px; max-width: 220px;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.3s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,60%,100% { opacity:.3; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }

  /* ---------- Composer ---------- */
  .composer { border-top: 1px solid var(--border); background: var(--head); padding: 10px 14px 14px; }

  .attach-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .attach-strip:empty { display: none; }

  .att {
    position: relative; border-radius: 9px; overflow: hidden;
    border: 1px solid var(--border); background: #232833;
  }
  .att img { display: block; width: 62px; height: 62px; object-fit: cover; }
  .att .name { font-size: 10.5px; color: var(--muted); padding: 3px 6px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .x {
    position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.72); color: #fff;
    border: none; border-radius: 50%; width: 19px; height: 19px; cursor: pointer; font-size: 12px; line-height: 1;
  }

  .input-row { display: flex; gap: 10px; align-items: flex-end; }

  textarea {
    flex: 1; background: #10131a; border: 1px solid var(--border); border-radius: 11px;
    padding: 12px 14px; color: var(--text); font-size: 14.5px; font-family: inherit;
    resize: none; max-height: 160px; outline: none; line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); }
  textarea:disabled { opacity: .5; }

  .btn-icon {
    background: #232833; border: 1px solid var(--border); color: var(--muted);
    width: 44px; height: 44px; border-radius: 11px; cursor: pointer; font-size: 18px; flex-shrink: 0;
  }
  .btn-icon:hover { color: var(--text); border-color: var(--accent); }

  .btn-send { background: var(--accent); color: #fff; border: none; border-radius: 11px; padding: 12px 20px; font-size: 14.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .btn-send:hover { background: #2f6fd8; }
  .btn-send:disabled { background: #334155; cursor: not-allowed; }

  .hint { font-size: 11px; color: var(--muted); margin-top: 7px; text-align: center; }

  /* ---------- Drop overlay ---------- */
  .dropzone {
    position: fixed; inset: 0; background: rgba(15,17,21,.9);
    display: none; place-items: center; z-index: 50; text-align: center;
    border: 3px dashed var(--accent); font-size: 17px; pointer-events: none;
  }
  .dropzone.on { display: grid; }

  /* ---------- Lightbox ---------- */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; place-items: center; z-index: 60; padding: 20px; }
  .lightbox.on { display: grid; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }

  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 18; }
  .backdrop.on { display: block; }

  @media (max-width: 820px) {
    .sidebar { position: fixed; z-index: 20; height: 100dvh; transform: translateX(-100%); transition: transform .2s ease; }
    .sidebar.on { transform: none; }
    .btn-menu { display: block; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand">
        <div class="logo">K</div>
        <div>
          <h1>KarirKU</h1>
          <p>Konsultan karier &amp; CV</p>
        </div>
      </div>
      <button class="btn-new" id="newBtn">+ Chat baru</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="side-foot">Riwayat tersimpan di komputer ini</div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="topbar">
      <button class="btn-menu" id="menuBtn" aria-label="Buka riwayat">☰</button>
      <div class="sub" id="convTitle">Chat baru</div>
      <button class="btn-clear" id="clearBtn">Hapus chat ini</button>
    </div>

    <div id="chat"></div>

    <div class="composer">
      <div class="attach-strip" id="strip"></div>
      <div class="input-row">
        <button class="btn-icon" id="attachBtn" title="Lampirkan foto atau berkas" aria-label="Lampirkan berkas">📎</button>
        <input type="file" id="fileInput" multiple accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain,text/csv" hidden />
        <textarea id="input" rows="1" placeholder="Ceritakan sedikit tentang dirimu, atau lampirkan CV/foto..."></textarea>
        <button class="btn-send" id="sendBtn">Kirim</button>
      </div>
      <div class="hint">Enter untuk kirim · Shift+Enter untuk baris baru · bisa paste foto langsung</div>
    </div>
  </main>
</div>

<div class="dropzone" id="dropzone">Lepaskan berkas di sini untuk dilampirkan</div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt="pratinjau" /></div>

<script>
/* ===================== Penyimpanan (IndexedDB) ===================== */
const DB_NAME = 'karirku';
const DB_VERSION = 1;
let dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('conversations')) {
        db.createObjectStore('conversations', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(mode, fn) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const t = db.transaction('conversations', mode);
    const store = t.objectStore('conversations');
    const out = fn(store);
    t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
    t.onerror = () => reject(t.error);
  }));
}

const store = {
  all: () => tx('readonly', (s) => s.getAll()),
  get: (id) => tx('readonly', (s) => s.get(id)),
  put: (conv) => tx('readwrite', (s) => { s.put(conv); return conv; }),
  del: (id) => tx('readwrite', (s) => { s.delete(id); }),
};

/* ===================== State ===================== */
const MAX_FILE_BYTES = 8 * 1024 * 1024;
const MAX_FILES = 4;
const ALLOWED = /^(image\/(png|jpeg|jpg|webp|gif|heic|heif)|application\/pdf|text\/(plain|csv|markdown))$/;

const GREETING = 'Hai! Aku KarirKU 👋\n\nBantu kamu pilih arah karier sekaligus merapikan CV.\n\nCoba ceritakan:\n\n1. Kamu lulusan apa & dari mana?\n2. Pengen kerja di bidang apa, atau masih bingung?\n\nBoleh juga lampirkan foto CV atau berkas lain, nanti aku baca.';

let conversations = [];
let currentId = null;
let pending = [];
let busy = false;

const el = {
  chat: document.getElementById('chat'),
  input: document.getElementById('input'),
  sendBtn: document.getElementById('sendBtn'),
  attachBtn: document.getElementById('attachBtn'),
  fileInput: document.getElementById('fileInput'),
  strip: document.getElementById('strip'),
  convList: document.getElementById('convList'),
  convTitle: document.getElementById('convTitle'),
  newBtn: document.getElementById('newBtn'),
  clearBtn: document.getElementById('clearBtn'),
  sidebar: document.getElementById('sidebar'),
  backdrop: document.getElementById('backdrop'),
  menuBtn: document.getElementById('menuBtn'),
  dropzone: document.getElementById('dropzone'),
  lightbox: document.getElementById('lightbox'),
  lightboxImg: document.getElementById('lightboxImg'),
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const current = () => conversations.find((c) => c.id === currentId) || null;

/* ===================== Render markdown ===================== */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}

function renderMarkdown(src) {
  const lines = String(src || '').split('\n');
  const out = [];
  let list = null;
  let code = null;

  const flushList = () => {
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
  };

  for (const raw of lines) {
    const line = raw.trimEnd();

    if (/^```/.test(line)) {
      if (code === null) { flushList(); code = []; } else { out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`); code = null; }
      continue;
    }
    if (code !== null) { code.push(raw); continue; }

    if (!line.trim()) { flushList(); continue; }

    if (/^(---+|\*\*\*+|___+)$/.test(line.trim())) { flushList(); out.push('<hr>'); continue; }

    const heading = line.match(/^\s{0,3}#{1,6}\s+(.*)$/);
    if (heading) { flushList(); out.push(`<h3>${inline(heading[1])}</h3>`); continue; }

    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    if (bullet) { (list ||= []).push(`<li>${inline(bullet[1])}</li>`); continue; }

    flushList();
    out.push(`<p>${inline(line)}</p>`);
  }

  if (code !== null) out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
  flushList();
  return out.join('');
}

/* ===================== Render pesan ===================== */
function filesMarkup(files) {
  if (!files || !files.length) return '';
  const items = files.map((f) =>
    f.mimeType.startsWith('image/')
      ? `<div class="thumb"><img src="${f.data}" alt="${escapeHtml(f.name)}" /></div>`
      : `<div class="chip">📄 <span>${escapeHtml(f.name)}</span></div>`
  ).join('');
  return `<div class="msg-files">${items}</div>`;
}

function addMessage(text, role, files) {
  const node = document.createElement('div');
  node.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  node.innerHTML = filesMarkup(files) + renderMarkdown(text);

  node.querySelectorAll('.thumb img').forEach((img) => {
    img.addEventListener('click', () => {
      el.lightboxImg.src = img.src;
      el.lightbox.classList.add('on');
    });
  });

  el.chat.appendChild(node);
  el.chat.scrollTop = el.chat.scrollHeight;
  return node;
}

function addError(text) {
  const node = document.createElement('div');
  node.className = 'msg error';
  node.innerHTML = renderMarkdown(text);
  el.chat.appendChild(node);
  el.chat.scrollTop = el.chat.scrollHeight;
}

function showTyping() {
  const node = document.createElement('div');
  node.className = 'msg bot';
  node.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  el.chat.appendChild(node);
  el.chat.scrollTop = el.chat.scrollHeight;
  return node;
}

function paintChat() {
  el.chat.innerHTML = '';
  const conv = current();
  if (!conv || conv.messages.length === 0) {
    const node = document.createElement('div');
    node.className = 'msg bot';
    node.innerHTML = renderMarkdown(GREETING);
    el.chat.appendChild(node);
  } else {
    conv.messages.forEach((m) => addMessage(m.content, m.role, m.files));
  }
  el.chat.scrollTop = el.chat.scrollHeight;
}

function paintSidebar() {
  el.convList.innerHTML = '';
  const sorted = [...conversations].sort((a, b) => b.updatedAt - a.updatedAt);
  sorted.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'conv' + (c.id === currentId ? ' active' : '');
    row.innerHTML = `<div class="title"></div><button class="del" title="Hapus">✕</button>`;
    row.querySelector('.title').textContent = c.title || 'Chat baru';

    row.addEventListener('click', () => {
      currentId = c.id;
      closeSidebar();
      paintSidebar();
      paintChat();
      el.convTitle.textContent = c.title || 'Chat baru';
      el.input.focus();
    });

    row.querySelector('.del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await store.del(c.id);
      conversations = conversations.filter((x) => x.id !== c.id);
      if (currentId === c.id) currentId = conversations[0]?.id || null;
      persistSidebarState();
      paintSidebar();
      paintChat();
      syncTitle();
    });

    el.convList.appendChild(row);
  });
}

function syncTitle() {
  const c = current();
  el.convTitle.textContent = c?.title || 'Chat baru';
}

/* ===================== Logika percakapan ===================== */
async function persistSidebarState() {
  for (const c of conversations) await store.put(c);
}

function newConversation() {
  const conv = { id: uid(), title: '', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
  conversations.unshift(conv);
  currentId = conv.id;
  pending = [];
  renderStrip();
  store.put(conv);
  paintSidebar();
  paintChat();
  syncTitle();
  closeSidebar();
  el.input.focus();
}

async function sendMessage() {
  const text = el.input.value.trim();
  if ((!text && !pending.length) || busy) return;

  const files = pending;
  const conv = current();
  if (!conv) return;

  const msg = { role: 'user', content: text, files, ts: Date.now() };
  conv.messages.push(msg);
  if (!conv.title) conv.title = (text || files[0].name).slice(0, 42);
  conv.updatedAt = Date.now();

  addMessage(text, 'user', files);
  el.input.value = '';
  el.input.style.height = 'auto';
  pending = [];
  renderStrip();
  setBusy(true);
  paintSidebar();
  syncTitle();
  store.put(conv);

  const typing = showTyping();

  try {
    const payload = conv.messages.map((m) => ({ role: m.role, content: m.content, files: m.files || [] }));
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: payload })
    });
    const data = await res.json().catch(() => ({}));

    typing.remove();

    if (!res.ok) {
      conv.messages.pop();
      addError(data.error || 'Terjadi kesalahan. Coba lagi ya.');
      store.put(conv);
      return;
    }

    conv.messages.push({ role: 'model', content: data.reply, files: [], ts: Date.now() });
    conv.updatedAt = Date.now();
    addMessage(data.reply, 'bot');
    paintSidebar();
    store.put(conv);
  } catch (err) {
    typing.remove();
    conv.messages.pop();
    addError(
      window.location.protocol === 'file:'
        ? 'Halaman ini dibuka langsung dari file, jadi tidak bisa menghubungi server.\n\nJalankan `npm start` di folder KarirKU, lalu buka http://localhost:3000 (bukan dobel-klik file index.html).'
        : 'Gagal terhubung ke server. Pastikan server KarirKU masih jalan (npm start).'
    );
    store.put(conv);
  } finally {
    setBusy(false);
    el.input.focus();
  }
}

function setBusy(state) {
  busy = state;
  el.sendBtn.disabled = state;
  el.input.disabled = state;
  el.attachBtn.disabled = state;
}

/* ===================== Lampiran ===================== */
function renderStrip() {
  el.strip.innerHTML = '';
  pending.forEach((f, i) => {
    const box = document.createElement('div');
    box.className = 'att';
    box.innerHTML =
      (f.mimeType.startsWith('image/') ? `<img src="${f.data}" alt="" />` : '') +
      `<div class="name"></div><button class="x" aria-label="Hapus">✕</button>`;
    box.querySelector('.name').textContent = f.name;
    box.querySelector('.x').addEventListener('click', () => {
      pending.splice(i, 1);
      renderStrip();
    });
    el.strip.appendChild(box);
  });
}

function addFiles(list) {
  for (const file of list) {
    if (pending.length >= MAX_FILES) {
      addError(`Maksimal ${MAX_FILES} lampiran per pesan.`);
      break;
    }
    if (!ALLOWED.test(file.type)) {
      addError(`Format "${file.name}" belum didukung. Pakai gambar (PNG/JPG/WebP), PDF, atau teks.`);
      continue;
    }
    if (file.size > MAX_FILE_BYTES) {
      addError(`"${file.name}" kebesaran (maks 8 MB).`);
      continue;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pending.push({ name: file.name, mimeType: file.type, data: reader.result });
      renderStrip();
    };
    reader.readAsDataURL(file);
  }
}

el.attachBtn.addEventListener('click', () => el.fileInput.click());
el.fileInput.addEventListener('change', (e) => {
  addFiles(e.target.files);
  e.target.value = '';
});

['dragenter', 'dragover'].forEach((ev) =>
  document.addEventListener(ev, (e) => {
    e.preventDefault();
    el.dropzone.classList.add('on');
  })
);
['dragleave', 'drop'].forEach((ev) =>
  document.addEventListener(ev, (e) => {
    e.preventDefault();
    if (ev === 'drop' || e.clientX <= 0 || e.clientY <= 0 || e.clientX >= innerWidth || e.clientY >= innerHeight) {
      el.dropzone.classList.remove('on');
    }
  })
);
document.addEventListener('drop', (e) => {
  if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});

document.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) {
    e.preventDefault();
    addFiles(files);
  }
});

/* ===================== Sidebar mobile ===================== */
function openSidebar() {
  el.sidebar.classList.add('on');
  el.backdrop.classList.add('on');
}
function closeSidebar() {
  el.sidebar.classList.remove('on');
  el.backdrop.classList.remove('on');
}

el.menuBtn.addEventListener('click', openSidebar);
el.backdrop.addEventListener('click', closeSidebar);

el.lightbox.addEventListener('click', () => el.lightbox.classList.remove('on'));

/* ===================== Events ===================== */
el.sendBtn.addEventListener('click', sendMessage);

el.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

el.input.addEventListener('input', () => {
  el.input.style.height = 'auto';
  el.input.style.height = Math.min(el.input.scrollHeight, 160) + 'px';
});

el.newBtn.addEventListener('click', newConversation);

el.clearBtn.addEventListener('click', async () => {
  const conv = current();
  if (!conv) return;
  if (!confirm('Hapus seluruh isi chat ini dari komputer ini?')) return;
  conv.messages = [];
  conv.title = '';
  conv.updatedAt = Date.now();
  await store.put(conv);
  paintSidebar();
  paintChat();
  syncTitle();
});

/* ===================== Init ===================== */
async function init() {
  try {
    conversations = (await store.all()) || [];
  } catch (err) {
    conversations = [];
  }

  conversations.sort((a, b) => b.updatedAt - a.updatedAt);

  if (conversations.length === 0) {
    const conv = { id: uid(), title: '', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
    conversations.push(conv);
    currentId = conv.id;
    store.put(conv);
  } else {
    currentId = conversations[0].id;
  }

  paintSidebar();
  paintChat();
  syncTitle();
  el.input.focus();
}

init();
</script>
</body>
